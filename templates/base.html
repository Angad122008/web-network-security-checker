<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Secure Login{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f1f5f9;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 12px 40px #0f172a12;
        }

        h1 { font-size: 27px; margin-top: 0; }
        p { line-height: 1.6; color: #64748b; }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        a { color: #2563eb; }
        .footer { margin-top: 22px; text-align: center; }

        .message {
            padding: 12px;
            border-radius: 8px;
            background: #f1f5f9;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .success { background: #dcfce7; }
        .error { background: #fee2e2; }
        .info { background: #dbeafe; }

        .muted { font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
